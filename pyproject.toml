[project]
name = "jubilee-solio-calibrate"
version = "0.1.0"
description = "Calibrate Solio team attack and defense strengths using FPL API stats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fuzzywuzzy>=0.18.0",
    "highspy>=1.11.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "python-levenshtein>=0.25.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
]

[project.scripts]
solio-calibrate = "solio_calibrate.cli:main"
solio-solve = "solio_calibrate.solve_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solio_calibrate"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
